name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout JS VM hardener
        uses: actions/checkout@v7
        with:
          repository: open-nan/js_vm
          ref: 6514932758469b35eae40779b541db4400542e7e
          path: .js-vm
          sparse-checkout: |
            Cargo.toml
            Cargo.lock
            crates
            pkg
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure site base path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == *.github.io ]]; then
            base_path=""
          else
            base_path="/$repository_name"
          fi
          echo "PAGES_BASE_PATH=$base_path" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=$base_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Generate map configuration
        env:
          GD_MAP_KEY: ${{ secrets.GD_MAP_KEY }}
          GD_MAP_SECURITY: ${{ secrets.GD_MAP_SECURITY }}
        run: npm run prepare:map

      - name: Build static site
        run: npm run build

      - name: Install JS VM build tool
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked --version 0.13.1

      - name: Harden map.js with JS VM
        shell: bash
        run: |
          mkdir -p .map-vm-input
          cp out/map.js .map-vm-input/map.js

          (
            cd .js-vm
            cargo run \
              --release \
              -p js_vm_cli \
              -- all --skip-opt -- \
              "$GITHUB_WORKSPACE/.map-vm-input" \
              --out "$GITHUB_WORKSPACE/.map-vm-output" \
              --entry map.js \
              --platform web \
              --clean \
              --no-static
          )

          rm "$GITHUB_WORKSPACE/.map-vm-output/map.bin.map"
          cp -R "$GITHUB_WORKSPACE/.map-vm-output/." out/
          test -f out/map.js
          test -f out/map.bin
          test -f out/js_vm_runtime_browser_bg.wasm
          test ! -f out/map.bin.map

      - name: Publish hardened site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          touch out/.nojekyll
          publish_dir="$RUNNER_TEMP/tripvas-gh-pages"
          mkdir -p "$publish_dir"
          cp -R out/. "$publish_dir/"

          cd "$publish_dir"
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
